- type: job
  id: Magistrate
  name: Magistrate
  description: "Make sure Security isn't being a bunch of shitbags, make sure both Security and Command are following Space Law and the Standard Operating Procedures."
  playTimeTracker: JobMagistrate
  requirements:
    - !type:CharacterDepartmentTimeRequirement
      department: Command
      min: 54000 # 15 hours
    - !type:CharacterDepartmentTimeRequirement
      department: Security
      min: 54000 # 15 hours
    - !type:CharacterTraitRequirement
      inverted: true
      traits:
        - Foreigner
        - ForeignerLight
        - Muted
    - !type:CharacterEmployerRequirement
      employers:
      - IdrisIncorporated
      - NanoTrasen
  weight: 20
  startingGear: MagistrateGear
  icon: "JobIconMagistrate"
  requireAdminNotify: true
  joinNotifyCrew: true
  supervisors: job-supervisors-centcom
  canBeAntag: false
  access:
  - Security
  - Brig
  - External
  - Cryogenics
  - Maintenance
  - Detective
  - Corpsman
  - Command
  - CentralCommand
  - Magistrate
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff
  afterLoadoutSpecial:
  - !type:ModifyEnvirosuitSpecial
    charges: 8
  - !type:ModifyEnvirohelmSpecial
    powerCell: PowerCellHigh

- type: startingGear
  id: MagistrateGear
  subGear:
  - MagistratePlasmamanGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitMagistrate
    shoes: ClothingShoesLeather
    gloves: ClothingHandsGlovesColorWhite
    id: CentcomPDA
    ears: ClothingHeadsetDignitary # Unites Dignitary roles (BSO, CL/NTR, Magistrate) into one department kinda. Also removes their SectComm channel so an unrobust Mag/BSO/CL doesn't result in comms of that sort being compromised, this is largely redundant with the addition of specific comms for Deathsquad and ERT though
    pocket1: UniqueMagistrateLockerTeleporter

- type: startingGear
  id: MagistratePlasmamanGear
  parent: BasePlasmamanMaskGear
  equipment:
    jumpsuit: ClothingUniformEnvirosuitMagistrate
    head: ClothingHeadEnvirohelmMagistrate
    gloves: ClothingHandsGlovesEnviroglovesWhite
