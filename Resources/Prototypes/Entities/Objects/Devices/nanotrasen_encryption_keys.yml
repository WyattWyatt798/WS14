- type: entity
  parent: [ EncryptionKey, BaseCentcommContraband ]
  id: EncryptionKeyDeathSquad # Comms for the guys that Sectoral Command sends in when they REALLY want something dead and a plain old Emergency Response Team isn't gonna do it
  name: NT Special Operations encryption key
  description: An encryption key used by the dreaded Special Operations Division.
  components:
  - type: EncryptionKey
    channels:
    - DeathSquadSpecific
    defaultChannel: DeathSquadSpecific
  - type: Sprite
    layers:
    - state: crypt_blue
    - state: nano_label

- type: entity
  parent: [ EncryptionKey, BaseCentcommContraband ]
  id: EncryptionKeyERT # corpos can protect and serve too (they do it for different reasons though)
  name: NT Emergency Response Team encryption key
  description: An encryption key used by Emergency Response Teams.
  components:
  - type: EncryptionKey
    channels:
    - ERTSpecific
    defaultChannel: ERTSpecific
  - type: Sprite
    layers:
    - state: crypt_blue
    - state: nano_label

- type: entity
  parent: [ EncryptionKey, BaseCentcommContraband ]
  id: EncryptionKeyDignitaryMagistrate # Magistrate's job is to make sure Sec and Command aren't being shitbags and are following Space Law and the Standard Operating Procedures specifically, not the other departments, therefore they only get Security and Command.
  name: "Magistrate's oversight encryption key"
  description: "An encryption key used by the unfortunate employees of the Dignitary department, who have to deal with a lot of paperwork and a lot of bullshit. This one's for the Magistrate."
  components:
  - type: EncryptionKey
    channels:
    - Dignitary
    - Command
    - Security
    - Common
    defaultChannel: Dignitary
  - type: Sprite
    layers:
    - state: crypt_blue
    - state: nano_label

- type: entity
  parent: [ EncryptionKey, BaseCentcommContraband ]
  id: EncryptionKeyDignitaryBlueshield # Blueshield is NOT security. They are bodyguards for Dignitary + Command staff, not a Security officer replacement.
  name: "Blueshield Officer's oversight encryption key"
  description: "An encryption key used by the unfortunate employees of the Dignitary department, who have to deal with a lot of paperwork and a lot of bullshit. This one's for the Blueshield Officer."
  components:
  - type: EncryptionKey
    channels:
    - Dignitary
    - Command
    - Medical
    - Common
    defaultChannel: Dignitary
  - type: Sprite
    layers:
    - state: crypt_blue
    - state: nano_label

- type: entity
  parent: [ EncryptionKey, BaseCentcommContraband ]
  id: EncryptionKeyDignitaryRepresentative # Needs to be a "budget" master encryption key since the NTR has to review *all* departments on station and update SC on stuff and relay orders from SC, not just one or two
  name: "Liaison's oversight encryption key"
  description: "An encryption key used by the unfortunate employees of the Dignitary department, who have to deal with a lot of paperwork and a lot of bullshit. This one's for the Corporate Liaison."
  components:
  - type: EncryptionKey
    channels:
    - Dignitary # Atlas 14 - Unites the Dignitary department and seperates them from SectCom
    - Common
    - Command
    - Engineering
    - Justice # Delta V - adds Justice department
    - Medical
    - Science
    - Security
    - Service
    - Supply
    - Prison # DeltaV
    defaultChannel: Dignitary
  - type: Sprite
    layers:
    - state: crypt_blue
    - state: nano_label

  - type: entity
  parent: [ EncryptionKey, BaseCentcommContraband ]
  id: EncryptionKeyDignitaryGeneric # completely generic Joe Schmoe dignitary key, comes with quite literally nothing else besides the Dignitary channel
  name: "Generic oversight encryption key"
  description: "An encryption key used by the unfortunate employees of the Dignitary department, who have to deal with a lot of paperwork and a lot of bullshit. This one's completely generic and just has the Dignitary channel loaded onto it."
  components:
  - type: EncryptionKey
    channels:
    - Dignitary
    defaultChannel: Dignitary
  - type: Sprite
    layers:
    - state: crypt_blue
    - state: nano_label
