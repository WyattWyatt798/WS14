- type: entity
  abstract: true
  parent: BaseItem
  id: EncryptionKey
  name: encryption key
  description: A small cypher chip for headsets.
  components:
  - type: EncryptionKey
  - type: Item
    sprite: Objects/Devices/encryption_keys.rsi
  - type: Sprite
    sprite: Objects/Devices/encryption_keys.rsi

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyCommon
  name: common encryption key
  description: "This key is used by just about anyone employed on NanoTrasen stations. Exclusive to each sector, you're not gonna hear another sector of space talking with this."
  components:
  - type: EncryptionKey
    channels:
    - Common
    defaultChannel: Common
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: common_label

- type: entity
  parent: [ EncryptionKey, BaseCargoContraband ]
  id: EncryptionKeyCargo
  name: logistics encryption key # DeltaV - Logistics Department replacing Cargo
  description: "An encryption key used by logistics employees. It's for the guys who have to push crates and deliver mail."
  components:
  - type: EncryptionKey
    channels:
    - Supply
    defaultChannel: Supply
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: cargo_label

- type: entity
  parent: [ EncryptionKey, BaseCentcommContraband ]
  id: EncryptionKeyCentCom
  name: sectoral command encryption key
  description: "An encryption key used by the Captain's bosses, and more indirectly the entire station's bosses."
  components:
  - type: EncryptionKey
    channels:
    - CentCom
    defaultChannel: CentCom
  - type: Sprite
    layers:
    - state: crypt_blue
    - state: nano_label

- type: entity
  parent: [ EncryptionKey, BaseCentcommCommandContraband ]
  id: EncryptionKeyStationMaster
  name: station master encryption key
  description: "An encryption used by the Captain and the Head of Personnel... Most of the time."
  components:
  - type: EncryptionKey
    channels:
    - Common
    - Command
    - Engineering
    - Justice # Delta V- adds Justice department
    - Medical
    - Science
    - Security
    - Service
    - Supply
    - Prison #DeltaV
    defaultChannel: Command
  - type: Sprite
    layers:
    - state: crypt_gold
    - state: cap_label

- type: entity
  parent: [ EncryptionKey, BaseCommandContraband ]
  id: EncryptionKeyCommand
  name: station command encryption key
  description: "An encryption key used by the Heads of Staff. Usually sought out by hostiles for good reason."
  components:
  - type: EncryptionKey
    channels:
    - Command
    defaultChannel: Command
  - type: Sprite
    layers:
    - state: crypt_silver
    - state: com_label

- type: entity
  parent: [ EncryptionKey, BaseEngineeringContraband ]
  id: EncryptionKeyEngineering
  name: engineering encryption key
  description: "An encryption key used by the engineers to talk while the entire station violently explodes around them."
  components:
  - type: EncryptionKey
    channels:
    - Engineering
    defaultChannel: Engineering
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: eng_label

- type: entity
  parent: [ EncryptionKey, BaseMedicalContraband ]
  id: EncryptionKeyMedical
  name: medical encryption key
  description: An encryption key used by those who save lives.
  components:
  - type: EncryptionKey
    channels:
    - Medical
    defaultChannel: Medical
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: med_label

- type: entity
  parent: [ EncryptionKey, BaseMedicalScienceContraband ]
  id: EncryptionKeyMedicalScience
  name: med-epi encryption key # DeltaV - Epistemics Department replacing Science
  description: An encryption key used by someone who hasn't decided which side to take.
  components:
  - type: EncryptionKey
    channels:
    - Medical
    - Science
    defaultChannel: Science
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: medsci_label

- type: entity
  parent: [ EncryptionKey, BaseScienceContraband ]
  id: EncryptionKeyScience
  name: epistemics encryption key # DeltaV - Epistemics Department replacing Science
  description: "An encryption key used by scientists. Surprisingly plasmaproof!"
  components:
  - type: EncryptionKey
    channels:
    - Science
    defaultChannel: Science
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: sci_label

- type: entity
  parent: [ EncryptionKey, BaseScienceContraband ]
  id: EncryptionKeyRobo
  name: robotech encryption key
  description: "An encryption key used by roboticists. Does not come with a LAH-6000."
  components:
  - type: EncryptionKey
    channels:
    - Science
    defaultChannel: Science
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: robotics_label

- type: entity
  parent: [ EncryptionKey, BaseSecurityLawyerContraband ]
  id: EncryptionKeySecurity
  name: security encryption key
  description: An encryption key used by security.
  components:
  - type: EncryptionKey
    channels:
    - Security
    - Prison #deltaV
    defaultChannel: Security
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: sec_label

- type: entity
  parent: [ EncryptionKey, BaseCivilianContraband ]
  id: EncryptionKeyService
  name: service encryption key
  description: An encryption key used by the service staff, tasked with keeping the station full, happy and clean.
  components:
  - type: EncryptionKey
    channels:
    - Service
    defaultChannel: Service
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: service_label

- type: entity
  parent: [ EncryptionKey, BaseSyndicateContraband ]
  id: EncryptionKeySyndie
  name: blood-red encryption key
  description: "An encryption key used by the Syndicate. Looks very evil, probably used to discuss how to destroy the station."
  components:
  - type: EncryptionKey
    channels:
    - Syndicate
    defaultChannel: Syndicate
  - type: Sprite
    layers:
    - state: crypt_red
    - state: synd_label
  - type: ReverseEngineering # Nyano
    difficulty: 5
    recipes:
      - EncryptionKeySyndie

- type: entity
  parent: [ EncryptionKey, BaseSiliconScienceContraband ]
  id: EncryptionKeyBinary
  name: binary translator key
  description: An encryption key that translates binary signals used by silicons.
  components:
  - type: EncryptionKey
    channels:
    - Binary
    defaultChannel: Binary
  - type: Sprite
    layers:
    - state: crypt_silver
    - state: ai_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyBinarySyndicate
  name: binary translator key
  description: "A syndicate encryption key that translates binary signals used by silicons. Probably shouldn't start talking on it without some kind of voice changer, though."
  components:
  - type: EncryptionKey
    channels:
    - Binary
    defaultChannel: Binary
  - type: Sprite
    layers:
    - state: crypt_red
    - state: ai_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyFreelance
  name: freelancer encryption key
  description: An encryption key used by freelancers, who may or may not have an affiliation. It looks like it's worn out.
  components:
    - type: EncryptionKey
      channels:
        - Freelance
      defaultChannel: Freelance
    - type: Sprite
      layers:
        - state: crypt_rusted
        - state: pirate_label
