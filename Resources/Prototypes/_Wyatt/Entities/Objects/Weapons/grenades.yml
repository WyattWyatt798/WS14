- type: entity
  parent: [ SmokeGrenade , BaseSyndicateContraband ]
  id: PeaceGasGrenade
  name: peace gas grenade
  description: Simple grenade containing Pax and Chloral Hydrate. While you won't fall asleep immediately, you won't be able to retaliate against your attacker if you get hit by this.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/tear_gas.rsi
  - type: SmokeOnTrigger
    duration: 10 # needs to be tested
    spreadAmount: 15
    solution:
      reagents:
      - ReagentId: Pax
        Quantity: 25
      - ReagentId: ChloralHydrate
        Quantity: 25

- type: entity
  parent: [ SmokeGrenade , BaseSyndicateContraband ]
  id: PolyacidGasGrenade
  name: polyacid gas grenade
  description: A gas grenade containing Polytrinic Acid. This has gotta be a war crime, not like you care though.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/tear_gas.rsi
  - type: SmokeOnTrigger
    duration: 7 # needs to be tested
    spreadAmount: 40
    solution:
      reagents:
      - ReagentId: PolytrinicAcid
        Quantity: 50

- type: entity
  parent: [ SmokeGrenade , BaseSyndicateContraband ]
  id: OmnizineGasGrenade
  name: omnizine gas grenade
  description: Very useful grenade containing Omnizine, but impractical to use in active combat. Heals anyone not wearing a sealed hardsuit and internals.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Grenades/tear_gas.rsi
  - type: SmokeOnTrigger
    duration: 10 # needs to be tested
    spreadAmount: 5
    solution:
      reagents:
      - ReagentId: Omnizine
        Quantity: 30
